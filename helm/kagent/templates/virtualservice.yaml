apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .kagent.fullname }}
  labels:
    app: {{ .kagent.fullname }}
spec:
  gateways:
  {{- range $hosts := .Values.virtualservice.gateways }}
  - {{ $hosts }}
  {{- end }}
  hosts:
    - {{ .Values.virtualservice.hostname | quote }}
  http:
  - route:
      - destination:
          host: {{ .kagent.fullname }}

