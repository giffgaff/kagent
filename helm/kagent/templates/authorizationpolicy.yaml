apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .kagent.fullname }}
  namespace: {{ .Values.virtualservice.namespace | quote }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            remoteIpBlocks:
            {{- range $IPs := .Values.virtualservice.whitelistIPs }}
            - {{ $IPs}}
            {{- end }}
      to:
        - operation:
            hosts:
              - {{ .Values.virtualservice.hostname | quote }}
  selector:
    matchLabels:
      app: {{ .Values.virtualservice.ingressgateway | quote }}
